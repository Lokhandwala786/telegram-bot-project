<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job History{% endblock %} — Amazon UK Alerter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <nav class="bg-slate-900 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4 justify-between">
      <a href="/" class="font-semibold text-lg tracking-tight">Job History</a>
      <div class="flex gap-4 text-sm">
        <a href="/" class="hover:text-blue-300 {% if nav_active|default('') == 'home' %}text-blue-300{% endif %}">Home</a>
        <a href="/jobs" class="hover:text-blue-300 {% if nav_active|default('') == 'jobs' %}text-blue-300{% endif %}">Jobs</a>
        <a href="/stats" class="hover:text-blue-300 {% if nav_active|default('') == 'stats' %}text-blue-300{% endif %}">Stats</a>
      </div>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-6xl mx-auto px-4 pb-8 text-xs text-slate-500">
    Read-only dashboard · same SQLite as the poller · bind to localhost in production
  </footer>
</body>
</html>
